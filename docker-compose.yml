# Kafka (KRaft, no ZooKeeper) → producer → Spark Structured Streaming → Parquet in ./data/spark_lake
#   docker compose up --build        # watch the stream
#   make report-spark                # charts from the Spark output
name: clickstream

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  create-topic:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create",
                 "--if-not-exists", "--topic", "clickstream", "--partitions", "3", "--replication-factor", "1"]
    restart: "no"

  producer:
    build: .
    command: ["produce", "--speedup", "120"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      create-topic: { condition: service_completed_successfully }
    restart: "no"

  spark:
    build: .
    command: ["spark", "--source", "kafka", "--trigger", "10 seconds",
              "--lake", "/app/data/spark_lake", "--checkpoint", "/app/data/spark_checkpoints"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./data:/app/data
      - ivy-cache:/opt/ivy
    depends_on:
      create-topic: { condition: service_completed_successfully }

volumes:
  ivy-cache:
